multi_run:
  0:
  8:
  16:
  24:
  32:
  40:
  48:
  56:
  64:

PROJECT_ROOT: ${oc.env:PROJECT_ROOT}

load:
  path: ${PROJECT_ROOT}/weights/MPC/MPC2-v3-small-vbr-pruned.pth.tar
  strict: false
  rules: # type, pattern, replacement
    - ["startswith", "dino.model", "useless"]

resolution_transform:
  type: ResolutionTransform
  mode: center_pad
  size: 64

model: 
  type: MPC_I2
  
  dino_backbone:
    type: cofai.backbone.Dinov2TimmBackbone
    model_size: small
    img_size: 512
    patch_size: 16
    dynamic_size: true
    slot: -3
    n_last_blocks: 4

  dino_codec:
    type: cofai.latent_codecs.vit_feature_codec.VbrVitUnionLatentCodec
    h_dim: 384
    y_dim: 48
    z_dim: 48
    groups: 16

  # run_eval 要求 task_feats 含 cls/semseg：与 eval_base.yaml 中 heads 条目对齐（OmegaConf 合并后解析）。
  heads:
    cls: ${heads.imagenet_cls_small_last4}
    semseg: ${heads.ade20k_seg_small_last4}

allow_heads:
  - imagenet_cls_small_last4
  - ade20k_seg_small_last4
  - voc2012_seg_small_last4