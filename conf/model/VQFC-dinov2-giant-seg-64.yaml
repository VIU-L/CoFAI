# @package _global_
# DINOv2-Timm giant + VQFC (64 codebook) for VOC2012 segmentation; engine path
# uses Dinov2TimmBackbone (no slide encode), reusing the legacy slide-trained
# VQFC seg checkpoint. Backbone setting is intentionally inconsistent with the
# original training (which used Dinov2OrgBackbone + slide windows).
model:
  type: Dinov2TimmSegVQFC
  dino_backbone:
    model_size: giant
    img_size: 512
    patch_size: 16
    dynamic_size: true
    slot: -1
    n_last_blocks: 1
  vqfc_codec:
    num_embeddings: 64
    embedding_dim: 50
    num_chunks: 1
    lmbda: 1.0
    ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/seg/epoch_300num_64chunk_1.pth.tar
  heads:
    semseg: ${heads.voc2012_seg_giant_last1}
