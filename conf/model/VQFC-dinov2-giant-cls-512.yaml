# @package _global_
# DINOv2-Original giant + VQFC (512 codebook) for ImageNet cls; aligns with
# examples/vqfc/config/dino_orig_slide_giant_cls_vqfc_512.yaml
model:
  type: Dinov2OrigClsVQFC
  dino_backbone:
    model_size: giant
    img_size: 224
    patch_size: 14
    dynamic_size: false
    slot: null
    n_last_blocks: 1
    ckpt_path: ${PROJECT_ROOT}/weights/dinov2/backbone/dinov2_vitg14_pretrain.pth
  vqfc_codec:
    num_embeddings: 512
    embedding_dim: 64
    num_chunks: 1
    lmbda: 1.0
    ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/cls/epoch_100num_512chunk_1.pth.tar
  heads:
    cls: ${heads.imagenet_cls_giant_last1}
