# @package _global_
# VTC-style MPC_I2: reg4 DINOv2-small + OutVbrVitSeparateLatentCodec (symmetric to VTC-dinov2-base-reg4-last4-vbr).
model:
  type: MPC_I2
  dino_backbone:
    type: cofai.backbone.Dinov2TimmBackbone
    model_size: small
    img_size: 512
    patch_size: 16
    dynamic_size: true
    slot: -3
    n_last_blocks: 4
    with_registers: true
  dino_codec:
    type: cofai.latent_codecs.VisualTokenCodec
    h_dim: 384
    y_dim: 48
    z_dim: 48
    groups: 16
    num_prefix_tokens: 5
  heads:
    cls: null
    semseg: null
