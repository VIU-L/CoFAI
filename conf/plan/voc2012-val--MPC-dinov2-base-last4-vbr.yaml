# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - /data: voc2012_val
  - /model: MPC-dinov2-base-last4-vbr
  - /heads: dinov2_head
  - /metrics:
    - voc2012_seg_metrics
  - _self_

name: voc2012-val--MPC-dinov2-base-last4-vbr
description: "data: VOC2012 val; model: MPC2-v3 vbr + DINOv2-base last4 layers + semseg decoder; task: segmentation"
dataset: ${datasets.voc2012_val}
test_transforms:
  - type: cofai.transforms.PadImage
    size: 512
    keys: [img, semseg]
  - type: cofai.transforms.PadToMultiple
    multiple: 64
    keys: [img, semseg]
  - type: cofai.transforms.AddIgnoreRegions
  - type: cofai.transforms.ToTensor
    keys: [img, semseg]
collate:
  mode: stack_only
task_configs:
  - label: semseg
    meter: ${metrics.voc2012_seg_metrics}
load:
  path: ${PROJECT_ROOT}/weights/MPC/MPC2-v3-base-vbr-pruned.pth.tar
  strict: false
  rules:
    - ["startswith", "dino.model", "useless"]
model:
  type: MPC_I2
  dino_backbone:
    type: cofai.backbone.Dinov2TimmBackbone
    model_size: base
    img_size: 512
    patch_size: 16
    dynamic_size: true
    slot: -3
    n_last_blocks: 4
  dino_codec:
    type: cofai.latent_codecs.vit_feature_codec.VbrVitUnionLatentCodec
    h_dim: 768
    y_dim: 48
    z_dim: 48
    groups: 16
  heads:
    semseg: ${heads.voc2012_seg_base_last4}
