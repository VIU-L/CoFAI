# @package _global_
defaults:
  - /args: default
  - /dataloader: default
  - /data: imagenet_sel100
  - /model: VQFC-dinov2-giant-cls-512
  - /heads: dinov2_head
  - /metrics:
    - cls_metrics
  - _self_

name: imagenet-sel100--VQFC-dinov2-giant-cls
description: "data: ImageNet sel100; model: VQFC + DINOv2-giant cls token + cls decoder; task: classification. With args.multi_run=true, sweeps codebook sizes 8/16/32/512/2048 on pretrained weights."
dataset: ${datasets.imagenet_sel100}
test_transforms:
  - type: cofai.transforms.ResizeImage
    size: [224, 224]
collate:
  mode: stack_only
task_configs:
  - label: cls
    kind: cls
    meter: ${metrics.cls_metrics}
model:
  type: Dinov2OrigClsVQFC
  dino_backbone:
    model_size: giant
    img_size: 224
    patch_size: 14
    dynamic_size: false
    slot: null
    n_last_blocks: 1
    ckpt_path: ${PROJECT_ROOT}/weights/dinov2/backbone/dinov2_vitg14_pretrain.pth
  vqfc_codec:
    num_embeddings: 512
    embedding_dim: 64
    num_chunks: 1
    lmbda: 1.0
    ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/cls/epoch_100num_512chunk_1.pth.tar
  heads:
    cls: ${heads.imagenet_cls_giant_last1}

# RD sweep: each key becomes args.quality (string) and output subdir logs/<name>/q<key>/.
# Keys match shipped checkpoints under weights/VQFC/DINOv2/cls/.
multi_run:
  8:
    model:
      vqfc_codec:
        num_embeddings: 8
        embedding_dim: 64
        num_chunks: 1
        lmbda: 1.0
        ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/cls/epoch_100num_8chunk_1.pth.tar
  16:
    model:
      vqfc_codec:
        num_embeddings: 16
        embedding_dim: 64
        num_chunks: 1
        lmbda: 1.0
        ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/cls/epoch_100num_16chunk_1.pth.tar
  32:
    model:
      vqfc_codec:
        num_embeddings: 32
        embedding_dim: 64
        num_chunks: 1
        lmbda: 1.0
        ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/cls/epoch_100num_32chunk_1.pth.tar
  512:
    model:
      vqfc_codec:
        num_embeddings: 512
        embedding_dim: 64
        num_chunks: 1
        lmbda: 1.0
        ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/cls/epoch_100num_512chunk_1.pth.tar
  2048:
    model:
      vqfc_codec:
        num_embeddings: 2048
        embedding_dim: 32
        num_chunks: 1
        lmbda: 1.0
        ckpt_path: ${PROJECT_ROOT}/weights/VQFC/DINOv2/cls/epoch_100num_2048chunk_1.pth.tar
